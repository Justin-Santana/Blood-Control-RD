<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Menú de navegación</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@600&display=swap"
    rel="stylesheet"
  />

  <style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
  }

  .side-nav {
    --nav-background: #981a1a;
    --item-background: #ff383c;

    position: relative;
    width: 240px;
    height: 640px;
    background: var(--nav-background);
    box-shadow: inset 0 0 0 1px rgb(0 0 0 / 12%);
    font-family: "Roboto", sans-serif;
  }

  .side-nav__list {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .side-nav__item {
    position: absolute;
    left: 12px;
    width: 216px;
  }

  .side-nav__link {
    position: relative;
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 8px;
    background: var(--item-background);
    color: #000;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    line-height: 16px;
  }

  .side-nav__label,
  .side-nav__icon {
    position: absolute;
    display: block;
  }

  .side-nav__label {
    white-space: nowrap;
  }

  .side-nav__icon {
    color: #fff;
    overflow: hidden;
  }

  .side-nav__link:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 3px;
  }

  /* Inicio */

  .side-nav__item--home {
    top: 28px;
    height: 59px;
  }

  .side-nav__item--home .side-nav__icon {
    left: 15px;
    top: 18px;
    width: 27px;
    height: 23px;
  }

  .side-nav__item--home .side-nav__label {
    left: 54px;
    top: 21.5px;
  }

  /* Fármacos */

  .side-nav__item--medication {
    top: 96px;
    height: 53px;
  }

  .side-nav__item--medication .side-nav__icon {
    left: 12px;
    top: 14px;
    width: 31px;
    height: 24px;
  }

  .side-nav__item--medication .side-nav__label {
    left: 52px;
    top: 21px;
  }

  /* Distribución y trazabilidad */

  .side-nav__item--distribution {
    top: 160px;
    height: 52px;
  }

  .side-nav__item--distribution .side-nav__icon {
    left: 15px;
    top: 11px;
    width: 23px;
    height: 26px;
  }

  .side-nav__item--distribution .side-nav__label {
    left: 41px;
    top: 19px;
  }

  /* Donantes voluntarios */

  .side-nav__item--donors {
    top: 229px;
    height: 52px;
  }

  .side-nav__item--donors .side-nav__icon {
    left: 15px;
    top: 14px;
    width: 24px;
    height: 24px;
  }

  .side-nav__item--donors .side-nav__label {
    left: 42px;
    top: 18px;
  }

  /* Geolocalización */

  .side-nav__item--location {
    top: 301px;
    height: 52px;
  }

  .side-nav__item--location .side-nav__icon {
    left: 16px;
    top: 14px;
    width: 24px;
    height: 24px;
  }

  .side-nav__item--location .side-nav__label {
    left: 45px;
    top: 18px;
  }

  /* Inventario y disponibilidad */

  .side-nav__item--inventory {
    top: 372px;
    height: 52px;
  }

  .side-nav__item--inventory .side-nav__icon {
    left: 16px;
    top: 14px;
    width: 24px;
    height: 24px;
  }

  .side-nav__item--inventory .side-nav__label {
    left: 43px;
    top: 18px;
  }
</style>


</head>

          <span class="side-nav__label">Distribución y Trazabilidad</span>

  </nav>
</body>
</html>
